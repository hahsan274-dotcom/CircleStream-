name: circle_play
description: iOS-styled streaming browser for an open FTP/HTTP media server.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  html: ^0.15.4
  video_player: ^2.8.6
  chewie: ^1.8.1
  shared_preferences: ^2.2.3
flutter:
  uses-material-design: true
